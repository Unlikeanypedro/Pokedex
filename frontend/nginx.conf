server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:8080;
        proxy_set_header Host $http_host;
        proxy_pass http://$backend$request_uri;
    }
}
